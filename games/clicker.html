<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speed Clicker</title>
  <style>
    body { background: #121212; color: white; font-family: monospace; text-align: center; padding-top: 50px; }
    button { font-size: 24px; padding: 20px 40px; background: #00ffcc; border: none; border-radius: 8px; cursor: pointer; }
    a { color: #ff007f; display: block; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Speed Clicker</h1>
  <p>Score: <span id="score">0</span></p>
  <button onclick="addScore()">CLICK ME!</button>
  <a href="../index.html">← Back to Arcade</a>

  <script>
    let score = 0;
    function addScore() {
      score++;
      document.getElementById('score').innerText = score;
    }
  </script>
</body>
</html>
